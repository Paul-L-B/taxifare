[project]
name = "taxifare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Le Bret", email = "paullebret123@gmail.com" }
]
requires-python = ">=3.12.9"
dependencies = [
    "joblib>=1.6.0",
    "pandas<3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
taxifare = "taxifare:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]
