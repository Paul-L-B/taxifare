[project]
name = "taxifare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Le Bret", email = "paullebret123@gmail.com" }
]
requires-python = ">=3.12.9"
dependencies = [
    "db-dtypes>=1.9.0",
    "fastapi>=0.165.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-bigquery-storage>=2.43.0",
    "joblib>=1.6.0",
    "pandas<3",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
taxifare = "taxifare:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    "seaborn>=0.13.2",
]
